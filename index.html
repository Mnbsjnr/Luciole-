<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131B2E">
<title>Luciole – Le GPS piéton qui t’éclaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--n:#131B2E;--n2:#1c2742;--l:#F5C451;--a:#8C5E00;--c:#F6F2E8;--w:#fffdf6;--t:#4b5468;--sk:#F5C451}
*{box-sizing:border-box;margin:0}
body{font:15px/1.45 'DM Sans',system-ui,sans-serif;background:#0b1020;color:var(--n);display:grid;place-items:center;min-height:100dvh}
h1,h2,h3,.big{font-family:'Space Grotesk',system-ui,sans-serif}
.app{width:100%;max-width:440px;height:100dvh;position:relative;overflow:hidden;background:var(--n)}
@media(min-width:500px){.app{height:min(880px,calc(100dvh - 32px));border-radius:36px;border:6px solid var(--n2);box-shadow:0 0 100px rgba(245,196,81,.2)}}
#map{position:absolute;inset:0;background:var(--n)}.leaflet-container{font:inherit}
.leaflet-control-attribution{background:rgba(19,27,46,.6)!important;color:#8e98b2!important;font-size:9px}.leaflet-control-attribution a{color:#aab2c5!important}
.glow{filter:drop-shadow(0 0 7px #F5C451)}
header{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 16px 26px;background:linear-gradient(var(--n) 35%,transparent);color:var(--c);pointer-events:none}
.pg header{background:var(--n);padding-bottom:12px}
.logo{display:flex;align-items:center;gap:9px;font:700 21px 'Space Grotesk';letter-spacing:-.4px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--sk);box-shadow:0 0 0 4px rgba(245,196,81,.22),0 0 16px var(--sk)}
.pill{background:var(--n2);color:var(--l);padding:5px 13px;border-radius:99px;font:700 14px 'Space Grotesk';border:1px solid rgba(245,196,81,.25)}
.glass{background:rgba(19,27,46,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(245,196,81,.16);color:var(--c);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
#search{position:absolute;top:60px;left:12px;right:12px;z-index:10;padding:10px}
.f{display:flex;align-items:center;gap:8px;padding:2px 10px;border-radius:14px;background:var(--n2);margin-bottom:6px}.f:last-of-type{margin-bottom:0}.f:focus-within{outline:2px solid var(--l)}
.f i{width:10px;height:10px;border-radius:50%;border:3px solid var(--l);flex:none}.f i.b{background:var(--l)}
.f input{flex:1;background:0;border:0;color:var(--c);font:inherit;padding:10px 0;min-width:0;outline:0}.f input::placeholder{color:#7d88a6}
.f button{background:0;border:0;color:var(--l);font:700 12px 'DM Sans';cursor:pointer;padding:6px}
#sg{max-height:170px;overflow:auto}#sg button{display:block;width:100%;text-align:left;background:0;border:0;color:var(--c);padding:9px 8px;border-top:1px solid #2a3558;font:13px 'DM Sans';cursor:pointer}
.sheet{position:absolute;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:10;padding:16px}
.sheet:before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:#3a4668;margin:-6px auto 12px}
.muted,.sheet p{color:#aab2c5;font-size:13px}
.seg{display:flex;background:var(--n2);border-radius:99px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:0;color:#aab2c5;padding:8px;border-radius:99px;font:700 13px 'DM Sans';cursor:pointer}.seg button.on{background:var(--l);color:var(--n)}
.big{font-size:36px;font-weight:700;line-height:1.05}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{background:var(--n2);padding:4px 10px;border-radius:99px;font-size:12px}
.live{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 10px}.live i{width:8px;height:8px;border-radius:50%;background:#5be28a;box-shadow:0 0 8px #5be28a}
.row{display:flex;gap:8px}
.btn{flex:1;border:2px solid transparent;border-radius:14px;padding:12px;font:700 14px 'DM Sans';cursor:pointer;background:var(--l);color:var(--n);transition:transform .1s}.btn:active{transform:scale(.97)}
.btn.ghost{background:0;border-color:#46527a;color:var(--c)}.btn.alert{background:#fbe9e7;color:#8a1c1c}.btn.sm{padding:8px 10px;font-size:13px}
.light .btn.ghost,.btn.ghost.light{border-color:var(--n);color:var(--n)}
a.btn{text-decoration:none;text-align:center;display:block}
.gm{display:block;text-align:center;color:var(--l);font-size:12px;margin-top:10px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--l);outline-offset:2px}
nav{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;display:flex;padding:6px}
nav button{flex:1;padding:8px 0 6px;border:0;background:0;font:500 11px 'DM Sans';color:#8e98b2;display:grid;justify-items:center;gap:3px;cursor:pointer;border-radius:16px}
nav button.on{color:var(--l);background:var(--n2)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page{position:absolute;inset:0;z-index:15;background:var(--c);padding:72px 16px 104px;overflow:auto;display:none}.page.on{display:block}
.hide{display:none!important}
.card{background:var(--w);border-radius:20px;padding:16px;margin:10px 0}.dark{background:var(--n);color:var(--c)}.dark small,.dark p{color:#aab2c5}
small{color:var(--t);font-size:13px}h2{font-size:23px}h3{font-size:16px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--c);border:2px solid transparent;border-radius:14px;padding:12px 6px;text-align:center;font:500 12px 'DM Sans';color:var(--n);cursor:pointer}.tile.on,.tile.sel2{border-color:var(--n);background:#fff}
.orb{width:36px;height:36px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 0 6px rgba(0,0,0,.06)}
.bar{height:8px;background:var(--n2);border-radius:9px;overflow:hidden;margin:8px 0 4px}.bar b{display:block;height:100%;background:var(--l)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}.stats div{background:var(--n2);border-radius:14px;padding:10px;text-align:center}.stats b{display:block;color:var(--l);font:700 22px 'Space Grotesk'}.stats small{color:#aab2c5;font-size:11px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #e8e1cd}
label.t{display:flex;gap:8px;align-items:center;margin:10px 0;font-size:14px}
.in{flex:1;padding:10px;border-radius:12px;border:2px solid #d9d1ba;font:inherit;min-width:0}
#sheetbg{position:absolute;inset:0;background:rgba(10,14,28,.65);display:none;align-items:flex-end;z-index:40}
#sheet{background:var(--c);width:100%;border-radius:26px 26px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));max-height:88%;overflow:auto}
#toast{position:absolute;left:16px;right:16px;top:70px;background:var(--n);color:var(--c);padding:12px 14px;border-radius:14px;font-size:14px;z-index:50;display:none;border:1px solid var(--l)}
.ff{width:22px;height:22px;border-radius:50%;background:var(--sk);border:3px solid #fff8;animation:pu 2.200s ease-in-out infinite}
@keyframes pu{0%,100%{box-shadow:0 0 0 6px rgba(245,196,81,.28),0 0 22px var(--sk)}50%{box-shadow:0 0 0 14px rgba(245,196,81,.06),0 0 38px var(--sk)}}
.am{width:28px;height:28px;border-radius:50%;background:var(--l);color:var(--n);font:700 16px 'Space Grotesk';display:grid;place-items:center;border:2px solid var(--n);box-shadow:0 0 16px rgba(245,196,81,.8);cursor:pointer}
.hm{width:20px;height:20px;border-radius:50%;background:var(--c);border:5px solid var(--n);box-shadow:0 0 0 2px var(--c)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="map"></div>
  <header><div class="logo"><span class="dot"></span>Luciole</div><div class="pill" id="pill">0</div></header>
  <div id="search" class="glass">
    <div class="f"><i></i><input id="from" placeholder="Départ" autocomplete="off" aria-label="Départ"><button data-a="loc">Ma position</button></div>
    <div class="f"><i class="b"></i><input id="to" placeholder="Où vas-tu ?" autocomplete="off" aria-label="Arrivée"></div>
    <div id="sg"></div>
  </div>
  <section class="sheet glass" id="s-trip"></section>
  <section class="sheet glass hide" id="s-me"></section>
  <section class="page" id="s-lum"></section>
  <section class="page" id="s-prof"></section>
  <nav class="glass">
    <button class="on" data-a="tab:trip"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11a7 7 0 0114 0c0 4.800-7 11-7 11z"/><circle cx="12" cy="10" r="2.500"/></svg>Trajet</button>
    <button data-a="tab:me"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Ma carte</button>
    <button data-a="tab:lum"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Lumens</button>
    <button data-a="tab:prof"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
  </nav>
  <div id="sheetbg"><div id="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const TYPES=['Rue mal éclairée','Travaux','Rue fermée','Attroupement','Harcèlement','Agression','Sol glissant','Passage risqué','Autre'];
const SKINS={classique:['Classique','#F5C451',0],aurore:['Aurore','#FF8A65',150],neon:['Néon','#4DD0E1',300],argent:['Argent','#B0BEC5',500]};
const today=()=>new Date().toISOString().slice(0,10);
const fresh=()=>({lum:140,steps:0,km:0,day:{d:today(),l:0,s:0},walks:[],skin:'classique',owned:['classique'],trail:false,proches:['Inès','Sarah'],share:true,alerts:[]});
let st;try{st=JSON.parse(localStorage.getItem('luciole2'))||fresh()}catch(e){st=fresh()}
if(st.day.d!==today())st.day={d:today(),l:0,s:0};
const save=()=>{try{localStorage.setItem('luciole2',JSON.stringify(st))}catch(e){}};
let tab='trip',mode='safe',cur=null,walk=null,P0=null,P1=null,pos=null,sug=[],tm,trailL;
if(typeof L==='undefined'){document.body.innerHTML='<p style="color:#fff;padding:24px">La carte ne se charge pas : vérifie ta connexion internet.</p>';throw 0}

/* carte : fond sombre CARTO + données OpenStreetMap, toute la France */
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([46.6,2.4],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19,subdomains:'abcd',attribution:'© OpenStreetMap · © CARTO'}).addTo(map);
L.control.attribution({position:'topright',prefix:false}).addTo(map);
const gR=L.layerGroup().addTo(map),gA=L.layerGroup().addTo(map),gM=L.layerGroup(),gW=L.layerGroup().addTo(map);
const ic=(c,h,s)=>L.divIcon({className:'',html:`<div class="${c}">${h}</div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
const ffm=L.marker([46.6,2.4],{icon:ic('ff','',22),interactive:false,zIndexOffset:900});

/* outils géo */
const D=(a,b)=>{const k=111320,x=(a[1]-b[1])*Math.cos(a[0]*Math.PI/180)*k,y=(a[0]-b[0])*k;return Math.hypot(x,y)};
const dens=p=>{const o=[p[0]];for(let i=1;i<p.length;i++){const n=Math.max(1,Math.ceil(D(p[i-1],p[i])/25));for(let k=1;k<=n;k++)o.push([p[i-1][0]+(p[i][0]-p[i-1][0])*k/n,p[i-1][1]+(p[i][1]-p[i-1][1])*k/n])}return o};
const jget=async(u,o)=>{const r=await fetch(u,o);if(!r.ok)throw 0;return r.json()};
const geo=async q=>(await jget('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=fr&accept-language=fr&q='+encodeURIComponent(q))).map(x=>({n:x.display_name,lat:+x.lat,lng:+x.lon}));
const routes=async(a,b)=>{const j=await jget(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson&alternatives=3`);
  if(!j.routes||!j.routes.length)throw 0;return j.routes.map(r=>({d:r.distance,p:r.geometry.coordinates.map(c=>[c[1],c[0]])}))};
/* éclairage public réel : voies OSM taguées lit=yes (Overpass) */
async function litChecker(qs){try{const all=qs.flat();if(qs[0].length*25>15000)return null;
  let s=90,w=190,n=-90,e=-190;all.forEach(p=>{s=Math.min(s,p[0]);n=Math.max(n,p[0]);w=Math.min(w,p[1]);e=Math.max(e,p[1])});
  const bb=[s-.0004,w-.0006,n+.0004,e+.0006].map(x=>x.toFixed(5)).join(',');
  const j=await jget('https://overpass-api.de/api/interpreter',{method:'POST',body:'data='+encodeURIComponent(`[out:json][timeout:15];way["highway"]["lit"="yes"](${bb});out geom;`)});
  const h={},k=(a,b)=>Math.floor(a/3e-4)+'_'+Math.floor(b/4e-4);
  j.elements.forEach(x=>dens((x.geometry||[]).map(g=>[g.lat,g.lon])).forEach(g=>{if(g)(h[k(g[0],g[1])]=h[k(g[0],g[1])]||[]).push(g)}));
  return q=>{let c=0;q.forEach(p=>{const a=Math.floor(p[0]/3e-4),b=Math.floor(p[1]/4e-4);let ok=0;for(let i=-1;i<2&&!ok;i++)for(let m=-1;m<2&&!ok;m++)if((h[(a+i)+'_'+(b+m)]||[]).some(g=>D(g,p)<40))ok=1;c+=ok});return c/q.length}}catch(e){return null}}
const near=q=>st.alerts.filter(a=>q.some(p=>D(p,[a.lat,a.lng])<40));

/* calcul du trajet le plus rassurant parmi les itinéraires piétons possibles */
async function plan(){if(!P0||!P1)return;$('#s-trip').innerHTML='<p>Calcul des itinéraires…</p>'+acts();
  try{const rs=(await routes(P0,P1)).map(r=>({...r,q:dens(r.p)}));const chk=await litChecker(rs.map(r=>r.q));
    rs.forEach(r=>{r.lit=chk?chk(r.q):null;r.near=near(r.q)});
    const sc=r=>(r.lit==null?.5:r.lit)*100-r.near.length*30-(r.d/rs[0].d-1)*40,best=rs.reduce((a,b)=>sc(b)>sc(a)?b:a);
    cur={short:rs[0],safe:best,n:rs.length};mode='safe';map.fitBounds(L.latLngBounds(best.q),{padding:[70,70]});drawRoutes();renderTrip()}
  catch(e){cur=null;gR.clearLayers();$('#s-trip').innerHTML='<p>Impossible de calculer ce trajet. Vérifie ta connexion et les adresses.</p>'+acts()}}
function drawRoutes(){gR.clearLayers();if(!cur)return;const on=cur[mode],off=cur[mode=='safe'?'short':'safe'];
  if(off!==on)L.polyline(off.q,{color:'#8892aa',weight:4,dashArray:'1 9',lineCap:'round',opacity:.75}).addTo(gR);
  L.polyline(on.q,{color:'#F5C451',weight:15,opacity:.2}).addTo(gR);L.polyline(on.q,{color:'#F5C451',weight:5,lineCap:'round',className:'glow'}).addTo(gR);
  L.marker(on.q[on.q.length-1],{icon:ic('hm','',20),interactive:false}).addTo(gR)}
function drawAlerts(){gA.clearLayers();st.alerts.forEach((a,i)=>L.marker([a.lat,a.lng],{icon:ic('am','!',28)}).on('click',()=>A.al(i)).addTo(gA))}
function drawMe(){gM.clearLayers();st.walks.forEach(w=>{L.polyline(w,{color:'#F5C451',weight:12,opacity:.18}).addTo(gM);L.polyline(w,{color:'#F5C451',weight:3,className:'glow'}).addTo(gM)})}

/* écrans */
const fmt=n=>String(n).replace('.',',');
const acts=()=>`<div class="row" style="margin-top:12px">${cur?`<button class="btn" data-a="go">${walk?'Arrêter':'Démarrer'}</button>`:''}<button class="btn ghost" data-a="report">Signaler</button><button class="btn alert" data-a="sos">Alerte</button></div>`;
function renderTrip(){
  if(!cur){$('#s-trip').innerHTML=`<h3>Trajet le plus rassurant</h3><p>Choisis un départ et une destination n’importe où en France. Luciole compare les itinéraires piétons selon l’éclairage et les alertes des marcheurs.</p>`+acts();return}
  const r=cur[mode],min=Math.round(r.d/80),arr=new Date(Date.now()+min*6e4),hh=arr.getHours()+':'+String(arr.getMinutes()).padStart(2,'0');
  const av=cur.short.near.filter(a=>!cur.safe.near.includes(a)).length;
  $('#s-trip').innerHTML=`<div class="seg"><button class="${mode=='safe'?'on':''}" data-a="mode:safe">Le plus rassurant</button><button class="${mode=='short'?'on':''}" data-a="mode:short">Le plus court</button></div>
  <div class="big">${min>=60?Math.floor(min/60)+' h '+String(min%60).padStart(2,'0'):min+' min'}</div><p>${fmt((r.d/1000).toFixed(1))} km · arrivée à ${hh}</p>
  <div class="chips"><span class="chip">${r.lit==null?'Éclairage : données indisponibles':Math.round(r.lit*100)+' % de rues éclairées'}</span><span class="chip">${av} alerte${av>1?'s':''} évitée${av>1?'s':''}</span><span class="chip">${r.near.length} alerte${r.near.length>1?'s':''} sur le trajet</span></div>
  ${st.share&&st.proches.length?`<div class="live"><i></i>${st.proches.join(' et ')} ${st.proches.length>1?'suivent':'suit'} ton trajet en direct</div>`:''}
  ${walk?'<p>Trajet en cours (démo accélérée)…</p>':''}${acts()}
  <a class="gm" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${P0.lat},${P0.lng}&destination=${P1.lat},${P1.lng}&travelmode=walking">Ouvrir dans Google Maps</a>
  <p style="margin-top:8px;font-size:11px">Luciole t’aide, mais ne remplace pas les secours : en danger, appelle le 17 ou le 112.</p>`}
function renderMe(){const q=new Set(st.walks.flat().map(p=>Math.round(p[0]*200)+'_'+Math.round(p[1]*140)));
  $('#s-me').innerHTML=`<h3>Ma carte révélée</h3><p>Chaque rue parcourue s’illumine.</p><div class="stats" style="margin-top:10px"><div><b>${fmt(st.km.toFixed(1))}</b><small>km marchés</small></div><div><b>${q.size}</b><small>quartiers révélés</small></div><div><b>${st.alerts.filter(a=>a.me).length}</b><small>alertes signalées</small></div></div>
  <p>${st.walks.length?'Ton Luciole Wrapped arrive en décembre.':'Termine un trajet pour illuminer ta première rue.'}</p>`}
function renderLum(){const d=st.day;
  $('#s-lum').innerHTML=`<h2>Mes Lumens</h2><div class="card dark"><div class="big" style="color:var(--l)">${st.lum}</div><div class="bar"><b style="width:${d.l/20*100}%"></b></div><small>${d.l} sur 20 gagnés aujourd’hui · ${d.s} pas</small></div>
  <div class="grid"><div class="card" style="margin:0"><b>+1</b><br><small>par 1 000 pas</small></div><div class="card" style="margin:0"><b>+5</b><br><small>signalement validé</small></div><div class="card" style="margin:0"><b>+2</b><br><small>alerte confirmée</small></div></div>
  <div class="card"><h3>Boutique</h3><div class="grid2">${Object.entries(SKINS).map(([k,[n,c,p]])=>{const o=st.owned.includes(k);return`<button class="tile ${st.skin==k?'on':''}" data-a="buy:${k}:${p}"><div class="orb" style="background:${c}"></div><b>${n}</b><br>${st.skin==k?'Équipé':o?'Équiper':p+' Lumens'}</button>`}).join('')}
  <button class="tile ${st.trail?'on':''}" data-a="trail"><div class="orb" style="background:repeating-linear-gradient(90deg,#F5C451 0 4px,transparent 4px 9px)"></div><b>Traînée lumineuse</b><br>${st.trail?'Activée':st.owned.includes('trail')?'Activer':'200 Lumens'}</button>
  <button class="tile" data-a="cafe"><div class="orb" style="background:#8C5E00"></div><b>Café partenaire</b><br>950 Lumens</button></div></div>
  <div class="card"><h3>Payer avec son temps ou son argent</h3><div class="grid"><button class="tile" data-a="pack:500:2,99"><b>500</b><br>2,99 €</button><button class="tile" data-a="pack:1200:5,99"><b>1 200</b><br>5,99 €</button><button class="tile" data-a="pack:3000:12,99"><b>3 000</b><br>12,99 €</button></div><p class="muted" style="margin-top:8px">Prototype : les achats sont simulés.</p></div>`}
function renderProf(){
  $('#s-prof').innerHTML=`<h2>Mon profil</h2><small>Tes proches voient ton trajet en direct.</small>
  <div class="card"><h3>Mes proches</h3>${st.proches.map((p,i)=>`<div class="item">${p}<button class="btn sm ghost light" style="flex:0" data-a="rm:${i}">Retirer</button></div>`).join('')||'<small>Aucun proche pour l’instant. Ajoute quelqu’un pour partager ton trajet.</small>'}
  <div class="row" style="margin-top:10px"><input class="in" id="np" placeholder="Prénom" maxlength="20" aria-label="Prénom du proche"><button class="btn sm" style="flex:0" data-a="add">Ajouter</button></div>
  <label class="t"><input type="checkbox" id="sh" ${st.share?'checked':''}> Partager mon trajet en direct</label></div>
  <div class="card dark"><h3>Luciole+</h3><p>3,99 €/mois ou 29,99 €/an : skins exclusifs, Lumens doublés, statistiques détaillées, mode hors ligne.</p><h3 style="margin-top:12px">Pack Famille</h3><p>6,99 €/mois pour 5 comptes : tableau de bord parents, trajets récurrents, arrivées notifiées.</p><p style="margin-top:10px;color:var(--l)">Toutes les fonctions de sécurité restent gratuites.</p></div>
  <button class="btn ghost light" data-a="reset" style="width:100%">Réinitialiser la démo</button>`}
const RN={trip:renderTrip,me:renderMe,lum:renderLum,prof:renderProf};
function refresh(){$('#pill').textContent=st.lum+' ●';document.documentElement.style.setProperty('--sk',SKINS[st.skin][1]);RN[tab]();drawAlerts();save()}

/* interface */
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)};
const sheet=h=>{$('#sheet').innerHTML=h;$('#sheetbg').style.display='flex'};
const close=()=>$('#sheetbg').style.display='none';
$('#sheetbg').addEventListener('click',e=>{if(e.target.id=='sheetbg')close()});
function addSteps(n){const b=Math.floor(st.steps/1000);st.steps+=n;st.day.s+=n;const g=Math.max(0,Math.min(Math.floor(st.steps/1000)-b,20-st.day.l));st.day.l+=g;st.lum+=g;return g}
const curPos=()=>walk?ffm.getLatLng():pos?{lat:pos[0],lng:pos[1]}:cur?{lat:cur.safe.q[0][0],lng:cur.safe.q[0][1]}:map.getCenter();
function locate(){if(!navigator.geolocation)return toast('Géolocalisation indisponible : tape une adresse de départ.');
  navigator.geolocation.getCurrentPosition(p=>{pos=[p.coords.latitude,p.coords.longitude];P0={lat:pos[0],lng:pos[1]};$('#from').value='Ma position';ffm.setLatLng(pos).addTo(gW);map.setView(pos,15);plan()},
  ()=>toast('Position refusée : tape une adresse de départ.'),{enableHighAccuracy:true,timeout:10000})}
function suggest(w){const q=$('#'+w).value;clearTimeout(tm);if(q.length<3){$('#sg').innerHTML='';return}
  tm=setTimeout(async()=>{try{sug=await geo(q);$('#sg').innerHTML=sug.map((x,j)=>`<button data-a="pickp:${w}:${j}">${x.n}</button>`).join('')||'<p style="padding:8px">Aucune adresse trouvée.</p>'}catch(e){}},450)}

/* marche animée sur l’itinéraire choisi */
function tick(now){if(!walk)return;const w=walk,q=w.r.q;w.prog=Math.min(1,(now-w.t0)/10000);const i=Math.floor(w.prog*(q.length-1));
  ffm.setLatLng(q[i]);map.panTo(q[i],{animate:false});if(trailL)trailL.setLatLngs(q.slice(0,i+1));
  if(w.prog<1)requestAnimationFrame(tick);else arrive()}
function arrive(){const r=walk.r,steps=Math.round(r.d/.75);st.km+=r.d/1000;st.walks.push(r.q.filter((_,i)=>i%4==0||i==r.q.length-1));if(st.walks.length>30)st.walks.shift();
  const g=addSteps(steps);walk=null;if(trailL){gW.removeLayer(trailL);trailL=null}pos?ffm.setLatLng(pos):gW.removeLayer(ffm);refresh();
  sheet(`<h2>Bien arrivée !</h2><p>${st.share&&st.proches.length?st.proches.join(' et ')+(st.proches.length>1?' sont prévenus.':' est prévenu(e).'):'Trajet terminé.'}</p><div class="card dark" style="text-align:center"><div class="big" style="color:var(--l)">+${g} Lumen${g>1?'s':''}</div><small>${steps} pas · plafond de 20 Lumens par jour</small></div><button class="btn" data-a="close">Super</button>`)}

const A={
  tab(t){tab=t;$('#app').classList.toggle('pg',t=='lum'||t=='prof');$('#search').classList.toggle('hide',t!='trip');$('#s-trip').classList.toggle('hide',t!='trip');$('#s-me').classList.toggle('hide',t!='me');
    ['lum','prof'].forEach(x=>$('#s-'+x).classList.toggle('on',x==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.a=='tab:'+t));
    t=='trip'?(map.addLayer(gR),map.addLayer(gA)):(map.removeLayer(gR),map.removeLayer(gA));
    if(t=='me'){drawMe();map.addLayer(gM);const a=st.walks.flat();if(a.length)map.fitBounds(L.latLngBounds(a),{padding:[60,60],maxZoom:16})}else map.removeLayer(gM);
    map.invalidateSize();refresh()},
  loc:locate,
  pickp(w,j){const x=sug[+j];$('#'+w).value=x.n.split(',').slice(0,2).join(',');w=='from'?P0=x:P1=x;$('#sg').innerHTML='';if(!P0&&pos)P0={lat:pos[0],lng:pos[1]};plan()},
  mode(m){if(walk)return toast('Arrête le trajet pour changer d’itinéraire.');mode=m;drawRoutes();renderTrip()},
  go(){if(walk){walk=null;if(trailL){gW.removeLayer(trailL);trailL=null}refresh();return}
    const r=cur[mode];walk={r,prog:0,t0:performance.now()};ffm.setLatLng(r.q[0]).addTo(gW);map.setView(r.q[0],17);
    if(st.trail)trailL=L.polyline([],{color:SKINS[st.skin][1],weight:4,dashArray:'1 8',lineCap:'round'}).addTo(gW);refresh();requestAnimationFrame(tick)},
  close,
  report(){window._pick=-1;sheet(`<h3>Ce que tu as vu</h3><small>À moins de 30 m de ta position</small><div class="grid" style="margin:12px 0">${TYPES.map((t,j)=>`<button class="tile" data-a="pick:${j}">${t}</button>`).join('')}</div><label class="t"><input type="checkbox" checked> Rester anonyme</label><button class="btn" data-a="send">Envoyer le signalement</button><p class="muted" style="margin-top:8px;color:var(--t)">+5 Lumens dès que d’autres marcheurs le confirment.</p>`)},
  pick(i,el){window._pick=+i;document.querySelectorAll('#sheet .tile').forEach(t=>t.classList.remove('sel2'));el.classList.add('sel2')},
  send(){if(window._pick<0)return toast('Choisis ce que tu as vu.');const p=curPos();st.alerts.push({lat:p.lat,lng:p.lng,t:window._pick,n:0,me:1});const a=st.alerts[st.alerts.length-1];close();refresh();if(cur&&!walk)plan();toast('Signalement envoyé : les itinéraires s’adaptent.');
    setTimeout(()=>{a.n=2;st.lum+=5;refresh();toast('2 marcheurs ont confirmé ton signalement : +5 Lumens')},4000)},
  al(i){const a=st.alerts[i];if(!a)return;sheet(`<h3>${TYPES[a.t]}</h3><p style="color:var(--t)">${a.n} marcheur${a.n>1?'s ont':' a'} confirmé cette alerte.</p><div class="row" style="margin-top:12px"><button class="btn" data-a="yes:${i}">Toujours là · +2</button><button class="btn ghost light" data-a="no:${i}">Plus là</button></div>`)},
  yes(i){const a=st.alerts[i];close();if(a.c)return toast('Tu as déjà confirmé cette alerte.');a.c=1;a.n++;st.lum+=2;refresh();toast('Merci ! +2 Lumens')},
  no(i){st.alerts.splice(+i,1);close();refresh();if(cur&&!walk)plan();toast('Alerte retirée.')},
  sos(){const p=curPos();sheet(`<h2>Besoin d’aide ?</h2><p style="color:var(--t)">${st.proches.length?'Ta position est envoyée à '+st.proches.join(' et ')+'.':'Ajoute des proches dans ton profil pour qu’ils reçoivent ta position.'}</p>
    <div class="row" style="margin:14px 0"><a class="btn alert" href="tel:17">Appeler le 17</a><a class="btn alert" href="tel:112">Appeler le 112</a></div>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/pharmacie/@${p.lat},${p.lng},17z">Pharmacies et commerces ouverts autour de moi</a>
    <button class="btn ghost light" data-a="close" style="width:100%;margin-top:8px">Je suis en sécurité</button>`)},
  buy(k,p){p=+p;if(st.owned.includes(k)){st.skin=k;return refresh()}if(st.lum<p)return toast('Il te manque '+(p-st.lum)+' Lumens.');st.lum-=p;st.owned.push(k);st.skin=k;refresh();toast('Skin débloqué !')},
  trail(){if(!st.owned.includes('trail')){if(st.lum<200)return toast('Il te manque '+(200-st.lum)+' Lumens.');st.lum-=200;st.owned.push('trail')}st.trail=!st.trail;refresh()},
  cafe(){if(st.lum<950)return toast('Il te manque '+(950-st.lum)+' Lumens.');st.lum-=950;refresh();sheet(`<h2>Un café offert</h2><p style="color:var(--t)">Montre ce code chez ton partenaire :</p><div class="big" style="text-align:center;margin:12px 0">LUCI-${Math.floor(1000+Math.random()*9000)}</div><button class="btn" data-a="close">Merci</button>`)},
  pack(n,pr){st.lum+=+n;refresh();toast('Achat simulé ('+pr+' €) : +'+n+' Lumens')},
  add(){const v=$('#np').value.trim();if(!v)return toast('Écris un prénom.');st.proches.push(v);refresh()},
  rm(i){st.proches.splice(+i,1);refresh()},
  reset(){if(confirm('Remettre la démo à zéro ?')){st=fresh();walk=null;cur=null;gR.clearLayers();refresh()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const[a,...x]=t.dataset.a.split(':');A[a]&&A[a](...x,t)});
document.addEventListener('input',e=>{if(e.target.id=='from'||e.target.id=='to')suggest(e.target.id)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&(e.target.id=='from'||e.target.id=='to')&&sug.length)A.pickp(e.target.id,0)});
document.addEventListener('change',e=>{if(e.target.id=='sh'){st.share=e.target.checked;save()}});
refresh();
</script>
</body>
</html>
